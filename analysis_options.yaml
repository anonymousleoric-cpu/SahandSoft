# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# SahandSoft edition: flutter_lints is enabled. A few style-only lints that
# commonly produce false positives around async UI code are relaxed so that
# CI `flutter analyze` focuses on real issues.

include: package:flutter_lints/flutter.yaml

linter:
  rules:
    prefer_single_quotes: true

analyzer:
  errors:
    # Style-only lints relaxed for CI stability (documented in README):
    prefer_const_constructors: ignore
    prefer_const_constructors_in_immutables: ignore
    prefer_const_declarations: ignore
    prefer_const_literals_to_create_immutables: ignore
    use_build_context_synchronously: ignore
    unused_local_variable: ignore
