name: sahandsoft
description: "SahandSoft — secure V2Ray VPN client by Daniel Afshari (SahandSoft)"
publish_to: 'none'

# SahandSoft edition starts its own version line.
version: 1.0.0+1

environment:
  sdk: ^3.5.2

dependencies:
  flutter:
    sdk: flutter

  # VPN engine (Xray core) — the real functional core of the app.
  flutter_v2ray:
    git:
      url: https://github.com/motad-dev/flutter_v2ray

  dio: ^5.7.0
  url_launcher: ^6.3.0
  flutter_launcher_icons: ^0.13.1
  package_info_plus: ^8.0.2
  shared_preferences: ^2.3.2
  installed_apps: ^2.2.1
  easy_localization: ^3.0.7
  iconsax: ^0.0.8
  safe_device: ^1.1.9

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/translations/

  fonts:
    # Shabnam — Persian & Latin, SIL Open Font License 1.1 (redistributable).
    # Medium ships as the regular (400) weight; Bold as 700.
    - family: Sahand
      fonts:
        - asset: assets/fonts/ShabnamMedium.ttf
          weight: 400
        - asset: assets/fonts/ShabnamMedium.ttf
          weight: 500
        - asset: assets/fonts/ShabnamBold.ttf
          weight: 700
